name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/jmanoj0905/cpp-tutor
  TRACER: ghcr.io/jmanoj0905/cpp-tutor-tracer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The valgrind compile dominates build time; the registry cache makes
      # every run after the first fast.
      - name: Build and push per-arch tracer image
        uses: docker/build-push-action@v6
        with:
          context: tracer
          push: true
          tags: ${{ env.TRACER }}:${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}/cache:tracer-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}/cache:tracer-${{ matrix.arch }},mode=max

      - name: Build app image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cpp-tutor:smoke
          build-args: |
            TRACER_IMAGE=${{ env.TRACER }}:${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}/cache:app-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}/cache:app-${{ matrix.arch }},mode=max

      - name: Smoke test
        run: scripts/smoke-container.sh cpp-tutor:smoke

      - name: Push by digest
        id: push
        # Rebuilds from the registry cache rather than pushing the exact
        # smoke-tested bytes (buildx container driver can't push a loaded
        # image by digest). Warm cache makes this a layer-for-layer replay;
        # a cache miss rebuilds unsmoked — accepted tradeoff.
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            TRACER_IMAGE=${{ env.TRACER }}:${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}/cache:app-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # ── CD: only after the multi-arch :latest manifest is live ──────────
  # Both jobs run only on main pushes: tag builds don't refresh :latest
  # (see is_default_branch gate above), so deploying them would ship stale.
  deploy-backend:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      # Render image services don't auto-pull a new :latest; the deploy hook
      # tells this specific service (srv-d9j3efv1dkcs73bl4pg0) to redeploy,
      # which re-pulls the freshly published image.
      - name: Trigger Render deploy
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        # Bake the Render backend URL into the bundle (same-origin isn't used
        # in the split deploy). Change here if the backend host ever moves.
        env:
          VITE_API: https://cpp-tutor-api.onrender.com
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=cpp-tutor --branch=main
